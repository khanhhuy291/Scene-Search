# Root configuration so that files outside app/ (scripts/, tooling) are linted
# and formatted with the same rules as the backend package. Without this, ruff
# falls back to its 88-column default for anything not under app/pyproject.toml.
target-version = "py311"
line-length = 100
extend-exclude = [
    "app",
    "frontend",
    "data",
    "reports",
]

[lint]
select = ["E", "F", "I", "UP", "SIM"]

[format]
quote-style = "double"
indent-style = "space"
