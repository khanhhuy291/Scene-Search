[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-search-p-081"
version = "0.1.0"
description = "RAV-14 multimodal scene indexing and semantic search service"
readme = {text = "SceneSearch backend service.", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "qdrant-client>=1.13,<2.0",
    "minio>=7.2,<8.0",
    "pydantic-settings>=2.7,<3.0",
    "loguru>=0.7,<1.0",
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=0.3,<2.0",
    "langgraph>=0.1,<1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5,<3.0",
    "torchvision>=0.20,<1.0",
    "ultralytics>=8.3,<9.0",
    "open-clip-torch>=2.30,<4.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pip-tools>=7.4,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "core*",
    "db*",
    "infrastructure*",
    "ml*",
    "models*",
    "repositories*",
    "schemas*",
    "search*",
    "services*",
    "worker*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests requiring infrastructure services",
    "e2e: end-to-end tests requiring the complete stack",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
