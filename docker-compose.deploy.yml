# Full production stack. Qdrant and MinIO are remote services from app/.env;
# Postgres and Redis remain private Docker services.
# Run: docker compose --env-file app/.env -f docker-compose.deploy.yml up -d --build
name: scenesearch-p-081-deploy

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_CORS_ORIGINS: ${DEPLOY_PUBLIC_ORIGIN:-http://localhost:8088}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenesearch}:${POSTGRES_PASSWORD:-scenesearch}@postgres:5432/${POSTGRES_DB:-scenesearch}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Qdrant already runs on the Docker host (published as :6335). Containers
  # reach it through host-gateway; set DEPLOY_QDRANT_URL to override this.
  QDRANT_URL: ${DEPLOY_QDRANT_URL:-http://host.docker.internal:6335}
  QDRANT_VECTOR_SIZE: 2048
  QDRANT_WRITE_VECTOR_NAME: qwen
  QDRANT_ALLOW_NAMED_VECTOR_WRITES: "true"
  ML_ENCODER_NAME: Qwen/Qwen3-VL-Embedding-2B
  ML_QWEN_MODEL_NAME: Qwen/Qwen3-VL-Embedding-2B
  ML_MODEL_VERSION: qwen3-vl-embedding-2b-v1
  ML_BATCH_SIZE: ${QWEN_EMBEDDING_REQUEST_BATCH_SIZE:-8}
  # Set both names for compatibility with older images.  Keeping this value in
  # Compose (rather than the production env file) also prevents an accidental
  # malformed override from making the API download a 2B checkpoint locally.
  QWEN_EMBEDDING_URL: http://qwen-embedding:8001
  ML_QWEN_EMBEDDING_URL: http://qwen-embedding:8001
  QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-scenesearch-internal}
  ML_QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-scenesearch-internal}
  QWEN_EMBEDDING_TIMEOUT: ${QWEN_EMBEDDING_TIMEOUT:-300}
  ML_QWEN_EMBEDDING_TIMEOUT: ${QWEN_EMBEDDING_TIMEOUT:-300}
  SEARCH_MODE: qwen
  SEARCH_VISUAL_VECTOR: qwen
  SEARCH_RERANK_ENABLED: "false"

services:
  api:
    build:
      context: ./app
      args: {EXTRAS: media}
    command: sh -c "alembic upgrade head && exec uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file: ./app/.env
    environment: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    depends_on:
      qwen-embedding: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: ./app
      args: {EXTRAS: media}
    command: celery -A worker.celery_app:celery_app worker -Q ingestion --loglevel=INFO --pool=solo
    env_file: ./app/.env
    environment: {<<: *backend-environment}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./data:/app/data:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('redis', 6379), 5).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      qwen-embedding: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  qwen-embedding:
    build:
      context: ./app
      args: {EXTRAS: ml}
    command: uvicorn ml.embedding_api:app --host 0.0.0.0 --port 8001 --workers 1
    env_file: ./app/.env
    environment:
      ML_ENCODER_NAME: Qwen/Qwen3-VL-Embedding-2B
      ML_QWEN_MODEL_NAME: Qwen/Qwen3-VL-Embedding-2B
      ML_MODEL_VERSION: qwen3-vl-embedding-2b-v1
      ML_DEVICE: cuda
      ML_DTYPE: float16
      ML_BATCH_SIZE: ${QWEN_EMBEDDING_BATCH_SIZE:-1}
      ML_IMAGE_SIZE: ${ML_IMAGE_SIZE:-224}
      QWEN_EMBEDDING_URL: ""
      ML_QWEN_EMBEDDING_URL: ""
      QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-scenesearch-internal}
      HF_HOME: /home/appuser/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/appuser/.cache/huggingface/hub
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    expose: ["8001"]
    volumes: ["huggingface_cache:/home/appuser/.cache/huggingface"]
    ipc: host
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: ["${DEPLOY_PORT:-8088}:80"]
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: postgres:16.14-alpine
    env_file: ./app/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenesearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenesearch}
      POSTGRES_DB: ${POSTGRES_DB:-scenesearch}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  huggingface_cache:
