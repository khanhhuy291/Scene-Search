name: scenesearch-p-081

x-backend-environment: &backend-environment
  # Connect to the GPU embedding container within Docker network
  QWEN_EMBEDDING_URL: http://embedding-api:8001
  ML_QWEN_EMBEDDING_URL: http://embedding-api:8001
  QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-scenesearch-internal}
  QWEN_EMBEDDING_TIMEOUT: ${QWEN_EMBEDDING_TIMEOUT:-300}
  QDRANT_ALLOW_NAMED_VECTOR_WRITES: "true"

services:
  api:
    build:
      context: ./app
      args:
        EXTRAS: media
    command: sh -c "alembic upgrade head && exec uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file: ./app/.env
    environment: *backend-environment
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      embedding-api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./app
      args:
        EXTRAS: media
    command: celery -A worker.celery_app:celery_app worker -Q ingestion --loglevel=INFO --pool=solo
    env_file: ./app/.env
    environment:
      <<: *backend-environment
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      disable: true
    depends_on:
      embedding-api:
        condition: service_healthy
    restart: unless-stopped

  embedding-api:
    build:
      context: ./app
      args:
        EXTRAS: ml
    command: uvicorn ml.embedding_api:app --host 0.0.0.0 --port 8001 --workers 1
    env_file: ./app/.env
    environment:
      ML_ENCODER_NAME: Qwen/Qwen3-VL-Embedding-2B
      ML_QWEN_MODEL_NAME: Qwen/Qwen3-VL-Embedding-2B
      ML_MODEL_VERSION: qwen3-vl-embedding-2b-v1
      ML_DEVICE: cuda
      ML_DTYPE: float16
      ML_BATCH_SIZE: ${QWEN_EMBEDDING_BATCH_SIZE:-1}
      ML_IMAGE_SIZE: ${ML_IMAGE_SIZE:-224}
      QWEN_EMBEDDING_URL: ""
      ML_QWEN_EMBEDDING_URL: ""
      QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-scenesearch-internal}
      HF_HOME: /home/appuser/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/appuser/.cache/huggingface/hub
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ports:
      - "8001:8001"
    expose:
      - "8001"
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface
    ipc: host
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  huggingface_cache:

